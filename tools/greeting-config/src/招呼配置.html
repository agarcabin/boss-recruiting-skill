@keyframes page-reveal{from{opacity:.72;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

.favorite-item{transition:background-color .16s ease,color .16s ease,transform .12s ease}

<script>

'use strict';
const $=id=>document.getElementById(id);
const S={root:null,files:[],active:null,original:'',text:'',bom:false,tab:'form',demo:false,busy:false,revision:0,directories:[],collapsed:new Set()};
const DEMO='# 示例岗位\n\n## 一、列表卡片\n\n### 1. 初筛词库\n\n> 备注：列表卡片命中任意词才会打开简历，留空为跳过列表判断。\n\n仓管、仓库管理、ERP、Excel\n\n### 2. 否决词库\n\n> 备注：命中任意否决词时跳过该卡片。\n\n\n## 二、电子简历\n\n### 1. 初筛词库\n\n> 备注：每组单独一行，可用 + 表示同时满足、/ 表示任选一组。\n\nA：仓管、收发货、库存管理\nB：Excel、ERP、系统录入\n匹配方式：A+B\n\n### 2. 减分词库\n\n> 备注：每命中一个不同减分词扣 10 分。\n\n\n## 三、其他配置\n\n单简历查看时间不低于：30 秒\n\n连续招呼五次后额外休息：30 秒\n\n同事几天以上可打招呼（填 0 为不判断同事）：7 天\n\n三句招呼（关闭为单句）：关\n\nAI优缺点判断：关\n\n减分至合格线后AI整体复盘：关\n\n过及格线就进行AI整体复盘：开\n\n偏好地点筛选：关\n\n## AI整体复盘规则\n\n> 备注：目标角色的人物画像\n\n结合仓储、收发货、库存管理经历和办公软件实际使用情况判断适配度。\n\n## 偏好地点筛选\n\n> 备注：填入目标地点城市或周边城市。\n\n宁波市、舟山市\n';
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function dirty(){return S.text!==S.original;}
function error(e){if(e?.name==='AbortError')return;const msg=e?.message||String(e);$('errorBanner').textContent='操作未完成：'+msg;$('errorBanner').hidden=false;}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,4500);}
function status(){const d=dirty(),invalid=S.tab==='form'&&[...$('formPanel').querySelectorAll('input')].some(n=>!n.checkValidity());$('save').disabled=!d||!S.root||S.demo||S.busy||invalid;$('discard').disabled=!d||S.busy;$('saveState').textContent=S.busy?'正在处理…':d?'未保存':S.demo?'仅供预览':'已保存';$('saveState').classList.toggle('dirty',d);document.title=(d?'* ':'')+'招呼配置 · '+(S.active?.name||'岗位后台');for(const id of ['connect','newFile','backups','demo','start'])$(id).disabled=S.busy||(!['connect','demo','start'].includes(id)&&!S.root);$('search').disabled=S.busy||!S.root;for(const n of document.querySelectorAll('.file'))n.disabled=S.busy||!S.root;$('formPanel').inert=S.busy;$('rawEditor').disabled=S.busy;}
function update(text){S.text=text;S.revision++;status();}
function linesOf(text){return text.replace(/\r\n/g,'\n').split('\n');}
function eolOf(text){return text.includes('\r\n')?'\r\n':'\n';}
function sections(text){const lines=linesOf(text),out=[];let fence=null;lines.forEach((line,i)=>{const f=line.match(/^\s*(`{3,}|~{3,})/);if(f){if(!fence)fence=f[1][0];else if(f[1][0]===fence)fence=null;return;}if(fence)return;const m=line.match(/^(#{1,6})\s+(.+?)\s*$/);if(m)out.push({index:i,level:m[1].length,title:m[2]});});return out.map((s,i)=>({...s,end:out[i+1]?.index??lines.length}));}
function bodyValue(lines,start,end){return lines.slice(start,end).filter(l=>l.trim()&&!/^\s*>/.test(l)).join('\n');}
function patchBody(text,headingIndex,value){const all=sections(text),s=all.find(x=>x.index===headingIndex);if(!s)throw new Error('原文章节已变化，请重新打开表单。');const lines=linesOf(text),part=lines.slice(s.index+1,s.end),editable=part.map((l,i)=>l.trim()&&!/^\s*>/.test(l)?i:-1).filter(i=>i>=0);const insertion=editable[0]??part.length;const next=part.filter((l,i)=>!editable.includes(i));const chunk=value?value.replace(/\r\n/g,'\n').split('\n'):[];if(!editable.length&&chunk.length&&next.length&&next.at(-1).trim())next.push('');next.splice(insertion,0,...chunk);if(chunk.length&&next.at(-1)?.trim())next.push('');lines.splice(s.index+1,s.end-s.index-1,...next);return lines.join(eolOf(text));}
function patchLine(text,index,value){const lines=linesOf(text);lines[index]=value;return lines.join(eolOf(text));}
function renderForm(){const area=$('formPanel');area.replaceChildren();const text=S.text,lines=linesOf(text),parts=sections(text),edits=new Map();let card=null;const commit=(type,index,value)=>{edits.set(type+':'+index,{type,index,value});let next=text;for(const p of [...edits.values()].sort((a,b)=>b.index-a.index))next=p.type==='body'?patchBody(next,p.index,p.value):patchLine(next,p.index,p.value);update(next);};
 const title=parts.find(s=>s.level===1);if(title){const label=el('label','field title-field');label.append(el('span','field-title','岗位标题'));const input=el('input');input.value=title.title;input.oninput=()=>commit('line',title.index,'# '+input.value);label.append(input);area.append(label);}
 for(const s of parts){if(s.level===1)continue;if(s.level===2||!card){card=el('section','section'+(/其他配置/.test(s.title)?' settings-section':''));card.append(el('h3','',s.level===2?s.title:'岗位内容'));area.append(card);}const body=bodyValue(lines,s.index+1,s.end),hasChild=parts.some(n=>n.index===s.end&&n.level>s.level);if(hasChild&&!body)continue;
 const contentLines=lines.slice(s.index+1,s.end).map((line,i)=>({line,index:s.index+1+i})).filter(x=>x.line.trim()&&!/^\s*>/.test(x.line));const settings=/其他配置/.test(s.title)&&contentLines.length&&contentLines.every(x=>/^(.+?[：:])\s*(.*)$/.test(x.line));
 if(settings){for(const x of contentLines){const m=x.line.match(/^(.+?[：:])(\s*)(.*)$/),label=m[1].replace(/[：:]$/,''),v=m[3].trim(),row=el('label','setting'),control=el('span','setting-control');row.append(el('span','setting-label',label));if(/^[开关]$/.test(v)){const toggle=el('span','toggle'),input=el('input');input.type='checkbox';input.setAttribute('aria-label',label);input.checked=v==='开';const state=el('span','toggle-text',v);input.onchange=()=>{commit('line',x.index,m[1]+m[2]+(input.checked?'开':'关'));state.textContent=input.checked?'开':'关';};toggle.append(input,el('span','track'));control.append(toggle,state);}else{const number=v.match(/^(\d+(?:\.\d+)?)(\s*)(秒|天|分钟|次)?$/),input=el('input');input.value=number?number[1]:m[3];input.type=number?'number':'text';if(number){input.min='0';input.step='any';input.required=true;}input.oninput=()=>{if(!input.checkValidity()){status();return;}commit('line',x.index,m[1]+m[2]+input.value+(number?(number[2]||'')+(number[3]||''):''));};control.append(input);if(number?.[3])control.append(el('small','',number[3]));}row.append(control);card.append(row);}const comments=lines.slice(s.index+1,s.end).filter(l=>/^\s*>/.test(l));if(comments.length)card.append(help(comments.map(l=>l.replace(/^\s*>\s?/,'' )).join('\n')));continue;}
 if(hasChild&&!body)continue;const label=el('label','field');if(s.level>2)label.append(el('span','field-title',s.title));const input=el('textarea');input.value=body;input.rows=Math.max(2,Math.min(8,body.split('\n').length+1));input.setAttribute('aria-label',s.title);input.placeholder='留空表示不填写此项';input.oninput=()=>commit('body',s.index,input.value);label.append(input);const remarks=lines.slice(s.index+1,s.end).filter(l=>/^\s*>/.test(l)).map(l=>l.replace(/^\s*>\s?/,''));if(remarks.length)label.append(help(remarks.join('\n')));card.append(label);
 }
 if(!parts.length){area.append(el('div','notice','此文件没有标准 Markdown 标题，请切换到「Markdown 原文」编辑。'));}else if(!area.querySelector('textarea')&&!area.querySelector('.setting')){area.append(el('div','notice','没有识别到配置章节，可在「Markdown 原文」中添加。'));}
}
function setTab(tab){S.tab=tab;$('formPanel').hidden=tab!=='form';$('rawPanel').hidden=tab!=='raw';for(const [id,value] of [['formTab','form'],['rawTab','raw']]){$(id).classList.toggle('active',tab===value);$(id).setAttribute('aria-selected',String(tab===value));}if(tab==='form')renderForm();else $('rawEditor').value=S.text;status();}
function showEditor(){const f=S.active;$('welcome').hidden=true;$('editor').hidden=false;$('breadcrumb').textContent=(S.demo?'操作示例':(f.path.includes('/')?f.path.slice(0,f.path.lastIndexOf('/')):'配置根目录'))+' / '+f.name;$('fileTitle').textContent=f.name.replace(/\.md$/i,'');$('fileMeta').textContent=S.demo?'示例不会写入文件':'上次读取：'+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · UTF-8';$('demoNotice').hidden=!S.demo;setTab(S.tab);status();}
function renderList(){const list=$('fileList'),q=$('search').value.trim().toLowerCase();list.replaceChildren();const filtered=S.files.filter(f=>(f.path+'\n'+f.text).toLowerCase().includes(q)),groups=new Map();for(const f of filtered){const key=f.path.includes('/')?f.path.slice(0,f.path.lastIndexOf('/')):'通用模板';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(f);}for(const [name,files] of groups){const group=el('details','group');group.open=!!q||!S.collapsed.has(name);group.ontoggle=()=>{if(!q){if(group.open)S.collapsed.delete(name);else S.collapsed.add(name);}};group.append(el('summary','',name+'（'+files.length+'）'));for(const f of files){const button=el('button','file'+(f.path===S.active?.path&&!S.demo?' active':''),f.name.replace(/\.md$/i,''));button.title=f.path;button.setAttribute('aria-pressed',String(f.path===S.active?.path&&!S.demo));button.onclick=()=>openFile(f);button.disabled=S.busy;group.append(button);}list.append(group);}if(!filtered.length)list.append(el('p','empty-list',q?'没有找到匹配的岗位':S.root?'当前目录暂无 Markdown 文件':'从本目录启动后显示岗位列表'));$('fileCount').textContent=S.files.length+' 个文件';}
function ask({title,text='',fields=[],confirm='确认',danger=false,action}){return new Promise(resolve=>{const dialog=$('dialog');$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('dialogFields').replaceChildren();$('dialogError').hidden=true;const inputs={};for(const f of fields){const label=el('label','field');label.append(el('span','field-title',f.label));const input=el(f.options?'select':'input');if(f.options){for(const o of f.options){const op=el('option','',o.label);op.value=o.value;input.append(op);}}else{input.type='text';input.required=f.required!==false;input.maxLength=180;}input.value=f.value||'';if(f.placeholder)input.placeholder=f.placeholder;inputs[f.key]=input;label.append(input);if(f.hint)label.append(el('small','',f.hint));$('dialogFields').append(label);}const ok=$('dialogConfirm');ok.textContent=confirm;ok.className=danger?'danger':'primary';ok.disabled=false;$('dialogCancel').disabled=false;let executing=false;const finish=value=>{dialog.close();resolve(value);};$('dialogCancel').onclick=()=>{if(!executing)finish(false);};dialog.oncancel=e=>{e.preventDefault();if(!executing)finish(false);};ok.onclick=async()=>{if(executing)return;for(const input of Object.values(inputs))if(!input.reportValidity())return;executing=true;ok.disabled=true;$('dialogCancel').disabled=true;try{const values=Object.fromEntries(Object.entries(inputs).map(([k,input])=>[k,input.value]));if(action)await action(values);finish(action?true:values);}catch(e){$('dialogError').textContent=e.message||String(e);$('dialogError').hidden=false;}finally{executing=false;ok.disabled=false;$('dialogCancel').disabled=false;}};dialog.showModal();(Object.values(inputs)[0]||$('dialogCancel')).focus();});}
async function leave(){if(!dirty())return true;return !!await ask({title:'放弃未保存的修改？',text:'当前修改尚未写回文件。继续后会丢弃这些修改。',confirm:'放弃修改',danger:true});}
